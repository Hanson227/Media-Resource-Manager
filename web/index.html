<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>影视资源管理器</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7/css/materialdesignicons.min.css">
</head>
<body>
<div id="app" v-cloak>
  <!-- PIN Lock Screen -->
  <div v-if="!pinUnlocked && !pinChecking" class="pin-overlay">
    <div class="lock-icon"><span class="mdi mdi-lock-outline"></span></div>
    <h2>输入访问密码</h2>
    <p class="hint">请输入 4 位数字密码</p>
    <div class="pin-input-wrap">
      <div v-for="i in 4" :key="i" class="pin-dot" :class="{ filled: pinValue.length >= i, active: pinValue.length === i-1 && !pinError }">{{ pinValue.length >= i ? '●' : '' }}</div>
    </div>
    <div class="pin-error">{{ pinError }}</div>
    <div class="pin-keypad" v-if="!pinVerifying">
      <button v-for="k in 9" :key="k" class="pin-key" @click="pinPress(k.toString())">{{ k }}</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" @click="pinPress('0')">0</button>
      <button class="pin-key" @click="pinDelete"><span class="mdi mdi-backspace-outline"></span></button>
    </div>
    <div v-else style="color:var(--text-tertiary);font-size:16px">验证中…</div>
    <p class="pin-hint-kb">电脑上可直接用键盘输入数字，退格删除</p>
  </div>

  <template v-if="pinUnlocked">
    <div class="layout-wrap">
      <!-- Loading indicator -->
      <div v-if="loading" class="loading-bar"></div>

      <!-- Offline Banner -->
      <div v-if="offline" class="offline-banner">
        <span class="mdi mdi-wifi-off"></span> 网络连接已断开，正在重连...
      </div>

      <!-- Top Bar -->
      <template v-if="!isConnectPage && !isPreviewPage && serverUrl">
        <div class="top-bar">
          <h1>{{ pageTitle }}</h1>
          <div class="top-actions">
            <button v-if="showRefresh" class="top-btn" @click="refresh" :title="'刷新'">
              <span class="mdi mdi-refresh"></span>
            </button>
          </div>
        </div>
      </template>

      <!-- Sidebar (tablet+, conditional) -->
      <nav class="sidebar" v-if="serverUrl && !isPreviewPage && !isConnectPage">
        <div class="sidebar-header">影视资源管理器</div>
        <div class="sidebar-nav">
          <button class="sidebar-item" :class="{ active: currentTab === 'units' }" @click="goTab('/units')">
            <span class="mdi mdi-folder-multiple-image"></span><span>单元</span>
          </button>
          <button class="sidebar-item" :class="{ active: currentTab === 'dedup' }" @click="goTab('/dedup')">
            <span class="mdi mdi-compare"></span><span>查重</span>
          </button>
          <button class="sidebar-item" :class="{ active: currentTab === 'messages' }" @click="goTab('/messages')">
            <span class="mdi mdi-message-badge-outline"></span><span>消息</span>
            <span v-if="unreadCount > 0" class="badge-num">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
          </button>
          <button class="sidebar-item" :class="{ active: currentTab === 'settings' }" @click="goTab('/settings')">
            <span class="mdi mdi-cog-outline"></span><span>设置</span>
          </button>
        </div>
      </nav>

      <!-- Main Content (always present) -->
      <div class="app-main">
        <router-view :server-url="serverUrl" @connected="onConnected" @disconnected="onDisconnected"
          @loading="onLoading" @error="onError" @unread="onUnread"></router-view>
      </div>
    </div>  <!-- /layout-wrap -->

    <!-- Bottom Tab Bar (mobile only, outside layout-wrap) -->
    <template v-if="serverUrl && !isPreviewPage && !isConnectPage">
      <nav class="bottom-tabs">
        <button class="tab-item" :class="{ active: currentTab === 'units' }" @click="goTab('/units')">
          <span class="mdi mdi-folder-multiple-image"></span>
          <span>单元</span>
        </button>
        <button class="tab-item" :class="{ active: currentTab === 'dedup' }" @click="goTab('/dedup')">
          <span class="mdi mdi-compare"></span>
          <span>查重</span>
        </button>
        <button class="tab-item" :class="{ active: currentTab === 'messages' }" @click="goTab('/messages')">
          <span class="mdi mdi-message-badge-outline"></span>
          <span>消息</span>
          <span v-if="unreadCount > 0" class="badge-num">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
        </button>
        <button class="tab-item" :class="{ active: currentTab === 'settings' }" @click="goTab('/settings')">
          <span class="mdi mdi-cog-outline"></span>
          <span>设置</span>
        </button>
      </nav>
    </template>
  </template>

  <!-- Bottom Sheet Menu -->
  <div v-if="sheetVisible" class="sheet-overlay" @click="hideSheet">
    <div class="sheet-panel" @click.stop>
      <div class="sheet-handle"></div>
      <div v-if="sheetTitle" style="font-size:13px;color:var(--text-secondary);padding:0 var(--space-4) var(--space-3);text-align:center">{{ sheetTitle }}</div>
      <button v-for="(item, i) in sheetItems" :key="i" class="sheet-item"
        :class="{ danger: item.danger }" @click="item.action(); hideSheet()">
        <span class="mdi" :class="item.icon"></span>{{ item.label }}
      </button>
      <button class="sheet-item sheet-cancel" @click="hideSheet">
        <span class="mdi mdi-close"></span>取消
      </button>
    </div>
  </div>
</div>

<script>
/* 脚本引导：CDN 双镜像 + 本地脚本严格按序加载。
   为什么要这样：Vue 是这个 SPA 的唯一入口，原先 index.html 写死单个 CDN
   （unpkg），实测它会整段 `net::ERR_CONNECTION_CLOSED` —— 那一下不是"图标没了"，
   而是**打开就是白屏、连 PIN 界面都没有**（实测复现）。所以：
   ① vue / vue-router 各备两个镜像，前一个 onerror 就换下一个；
   ② 本地脚本必须按 js-core → js-gesture → js-pages → js-app 顺序执行
      （js-core 第一行就是 `const { createApp } = Vue`，Vue 未就绪会整页崩）。 */
(function () {
  var MIRRORS = {
    vue: ['https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js',
          'https://unpkg.com/vue@3/dist/vue.global.prod.js'],
    router: ['https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.prod.js',
             'https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js']
  };
  var LOCAL = ['js-core.js', 'js-gesture.js', 'js-pages.js', 'js-app.js'];

  function fail() {
    var el = document.getElementById('app');
    if (!el) return;
    el.removeAttribute('v-cloak');   // 否则错误提示自己被 v-cloak 藏着
    el.innerHTML = '<div style="padding:48px 24px;color:#e5e7eb;'
      + 'font-family:system-ui,sans-serif;text-align:center">'
      + '<h2 style="font-size:16px">加载失败</h2>'
      + '<p style="color:#9ca3af;font-size:13px;line-height:1.8">'
      + '无法从 CDN 加载 Vue（jsdelivr / unpkg 都不通）。<br>'
      + '请检查本机网络或代理后刷新页面。</p></div>';
  }

  // 同一资源依次尝试多个镜像，任一成功即回调
  function loadOne(urls, onDone) {
    var i = 0;
    (function next() {
      if (i >= urls.length) { fail(); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = onDone;
      s.onerror = next;
      document.head.appendChild(s);
    })();
  }

  // 一组本地脚本按顺序串行加载（动态插入默认 async，必须等上一个 onload）
  function loadList(urls, onDone) {
    var i = 0;
    (function next() {
      if (i >= urls.length) { onDone(); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = next;
      s.onerror = next;      // 本地文件不该失败，但不能卡死整条链
      document.head.appendChild(s);
    })();
  }

  loadOne(MIRRORS.vue, function () {
    loadOne(MIRRORS.router, function () {
      loadList(LOCAL, function () {});
    });
  });
})();
</script>

</body>
</html>
